{% extends 'theme/base.html' %}
{% load static %}

{% block content %}
<style>
    /* Inayos ang background para malinis */
    .map-wrapper {
        background: #f1f5f9;
        padding: 1.5rem;
        margin: -1.5rem;
        min-height: 100vh;
    }

    /* Header */
    .map-header {
        background: linear-gradient(135deg, #ff8c00, #ff5e00);
        color: white;
        padding: 1.5rem 2rem;
        border-radius: 16px;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .map-header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
    .map-header p { margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9; }

    /* Sidebar Card */
    .sidebar-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        height: 75vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sidebar-header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
        font-weight: 700;
        color: #1e293b;
    }
    .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
    }
    .resto-item {
        display: flex;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        margin-bottom: 1rem;
        cursor: pointer;
        transition: 0.2s;
        background: #fff;
    }
    .resto-item:hover, .resto-item.active {
        border-color: #ff8c00;
        background: #fff7ed;
    }
    .resto-item img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
    .resto-item h4 { margin: 0 0 4px 0; font-size: 0.9rem; font-weight: 700; color: #1e293b; }
    .resto-item p { margin: 0; font-size: 0.75rem; color: #64748b; }

    /* Map Container */
    .map-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        height: 75vh; /* Parehong height sa sidebar */
        overflow: hidden;
    }
    #map {
        width: 100%;
        height: 100%;
    }
    
    /* Popup */
    .popup-title { font-weight: 800; color: #1e293b; margin-bottom: 5px; }
    .popup-address { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
    .popup-btn { background: #ff8c00; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 0.7rem; }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<div class="map-wrapper">
    
    <!-- HEADER -->
    <div class="map-header">
        <div>
            <h1><i class="fas fa-map-marked-alt"></i> Food Finder Map</h1>
            <p>Explore all restaurant locations in Kabankalan City.</p>
        </div>
        <a href="{% url 'food_finder:restaurant_list' %}" class="btn btn-light fw-bold text-warning">
            <i class="fas fa-list"></i> View List
        </a>
    </div>

    <!-- BOOTSTRAP ROW -->
    <div class="row g-4">
        
        <!-- KALIWA: SIDEBAR (Listahan) -->
        <div class="col-md-4">
            <div class="sidebar-card">
                <div class="sidebar-header">
                    <i class="fas fa-store text-warning"></i> SELECT RESTAURANT
                </div>
                <div class="sidebar-list">
                    {% for r in restaurants %}
                    <div class="resto-item" id="item-{{ r.id }}" onclick="focusMap({{ r.lat }}, {{ r.lng }}, {{ r.id }})">
                        <img src="{{ r.image }}" alt="{{ r.name }}">
                        <div>
                            <h4>{{ r.name }}</h4>
                            <p><i class="fas fa-map-marker-alt text-warning"></i> {{ r.address }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- KANAN: MAPA -->
        <div class="col-md-8">
            <div class="map-card">
                <div id="map"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize Map
    var map = L.map('map').setView([9.9899, 122.8146], 14);

    // 2. Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap France',
        maxZoom: 19
    }).addTo(map);

    // 3. Icon
    var customIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    var allMarkers = {};

    // 4. Loop for Markers
    {% for r in restaurants %}
        var marker = L.marker([{{ r.lat }}, {{ r.lng }}], {icon: customIcon}).addTo(map);
        
        var popup = `
            <div class="popup-title">{{ r.name }}</div>
            <div class="popup-address"><i class="fas fa-map-marker-alt" style="color:#ff8c00;"></i> {{ r.address }}</div>
            <a href="https://www.google.com/maps/search/?api=1&query={{ r.lat }},{{ r.lng }}" target="_blank" class="popup-btn">
                Get Directions
            </a>
        `;
        
        marker.bindPopup(popup);
        allMarkers[{{ r.id }}] = marker;
    {% endfor %}

    // 5. Focus Function
    function focusMap(lat, lng, id) {
        // Zoom in to level 19
        map.setView([lat, lng], 19);
        
        // Open popup
        if (allMarkers[id]) {
            allMarkers[id].openPopup();
        }

        // Highlight active item
        document.querySelectorAll('.resto-item').forEach(item => item.classList.remove('active'));
        document.getElementById('item-' + id).classList.add('active');
    }

    // 6. Fix Gray Box Issue
    setTimeout(function() {
        map.invalidateSize();
    }, 500);
</script>

{% endblock %}
