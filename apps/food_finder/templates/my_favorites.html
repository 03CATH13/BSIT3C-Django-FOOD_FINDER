<!DOCTYPE html>
<html>
<head>
    <title>My Favorites</title>
</head>
<body>
    <h1>♥ My Favorite Restaurants</h1>
    <a href="{% url 'finder:restaurant_list' %}">Back to Home</a>
    <hr>
    
    <ul>
    {% for fav in favorites %}
        <li>
            <a href="{% url 'finder:restaurant_detail' fav.restaurant.pk %}">
                {{ fav.restaurant.name }}
            </a> 
            ({{ fav.restaurant.city }})
        </li>
    {% empty %}
        <li>You haven't favorited any restaurants yet.</li>
    {% endfor %}
    </ul>
</body>
</html>
