{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabankalan Eats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; }
        .navbar-custom { background-color: #1a1a1a; padding: 15px 30px; border-bottom: 1px solid #333; }
        .logo-text { color: #ff4d6d; font-weight: bold; font-size: 24px; text-decoration: none; }
        .icon-link { color: white; font-size: 22px; text-decoration: none; position: relative; margin-left: 20px; outline: none; }
        .icon-link:hover { color: #ff4d6d; }
        .cart-badge { position: absolute; top: -8px; right: -12px; background-color: #ff4d6d; color: white; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 50%; }
    </style>
</head>
<body>

    <nav class="navbar-custom d-flex justify-content-between align-items-center">
        <a href="{% url 'food_finder:home' %}" class="logo-text">🍔 Kabankalan Eats</a>
        <div>
            <a href="{% url 'food_finder:search_results' %}" class="icon-link"><i class="fas fa-search"></i></a>
            <a href="{% url 'food_finder:my_orders' %}" class="icon-link"><i class="fas fa-shopping-cart"></i><span class="cart-badge">2</span></a>
            <a href="{% url 'food_finder:home' %}" class="icon-link"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
