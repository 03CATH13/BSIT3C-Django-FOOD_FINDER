{% extends 'theme/base_dashboard.html' %}
{% block content %}
<style>
    .page-wrapper { background: #0f0f13; position: fixed; inset: 0; padding: 3rem 2rem; overflow-y: auto; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
    .header-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .header-subtitle { color: #a1a1aa; margin-bottom: 30px; }
    .empty-state { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 50px; text-align: center; border: 1px dashed rgba(255,255,255,0.1); }
</style>
<div class="page-wrapper">
    <a href="/" style="color: #eb78bf; text-decoration: none; margin-bottom: 20px; display: inline-block;">&larr; Back to Home</a>
    <div class="header-title"><i class="fas fa-receipt" style="color: #8b5cf6;"></i> My Orders</div>
    <p class="header-subtitle">Track your past and current food orders here.</p>
    
    <div class="empty-state">
        <i class="fas fa-shopping-bag" style="font-size: 3rem; color: #333; margin-bottom: 15px;"></i>
        <h3>No orders yet</h3>
        <p style="color: #888;">Looks like you haven't ordered anything. Start exploring restaurants!</p>
        <a href="{% url 'food_finder:restaurant_list' %}" style="display: inline-block; margin-top: 15px; padding: 10px 20px; background: #8b5cf6; color: white; border-radius: 8px; text-decoration: none;">Browse Restaurants</a>
    </div>
</div>
{% endblock %}
