{% extends 'theme/base_dashboard.html' %}
{% block content %}
<style>
    .page-wrapper { background: #0f0f13; position: fixed; inset: 0; padding: 3rem 2rem; overflow-y: auto; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
    .back-link { color: #eb78bf; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; font-weight: 600; }
    .header-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
    .header-subtitle { color: #a1a1aa; margin-bottom: 30px; }
    .promo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .promo-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; }
    .promo-card h3 { margin: 0 0 5px 0; font-size: 1.3rem; color: white; }
    .promo-card p { margin: 0 0 15px 0; font-size: 0.9rem; color: #a1a1aa; }
    .promo-code { display: inline-block; background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; padding: 8px 15px; border-radius: 8px; font-size: 1rem; letter-spacing: 1px; }
</style>

<div class="page-wrapper">
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="header-title"><i class="fas fa-tags" style="color: #f59e0b;"></i> Promos & Discounts</div>
    <p class="header-subtitle">Grab these exclusive deals before they expire!</p>

    <div class="promo-grid">
        {% for promo in promos %}
        <div class="promo-card" style="border-color: {{ promo.color }};">
            <h3>{{ promo.title }}</h3>
            <p>{{ promo.description }}</p>
            <div class="promo-code" style="background: {{ promo.color }}; color: #0f0f13;">{{ promo.code }}</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
