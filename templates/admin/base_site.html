{% extends "admin/base_site.html" %}
{% block extrahead %}
{{ block.super }}
<style>
/* PINK HEADER */
#header { background: #ff2e88 !important; color: #fff !important; padding: 12px 20px !important; }
#header a, #header a:link, #header a:visited { color: #fff !important; }
#branding h1, #branding h1 a { color: #fff !important; font-weight: 700 !important; font-size: 20px !important; }
#user-tools { color: #fff !important; font-size: 13px !important; }
#user-tools a { color: #fff !important; border-bottom: 1px solid rgba(255,255,255,0.5) !important; }
div.breadcrumbs { background: #ff5da2 !important; color: #fff !important; padding: 10px 20px !important; }
div.breadcrumbs a { color: #fff !important; }
.module h2, .module caption, .inline-group h2 { background: #ff2e88 !important; color: #fff !important; }
a:link, a:visited { color: #ff2e88; }
a:hover { color: #d61a6e; }
.button, input[type=submit], input[type=button], .submit-row input, a.button { background: #ff2e88 !important; }
/* ICONS - PUTI LANG */
.addlink, .changelink, .deletelink, .viewlink { color: #fff !important; }
.object-tools a { color: #fff !important; background: #ff2e88 !important; }
/* TABLE HEADER - PINK NA TANAN, LABI NA ANG ADDRESS */
#result_list thead th { background: #ff2e88 !important; color: #fff !important; }
#result_list thead th a, #result_list thead th a:link, #result_list thead th a:visited { color: #fff !important; }
#result_list thead th.sorted { background: #d61a6e !important; }
#result_list thead th.field-address_with_space { background: #ff2e88 !important; color: #fff !important; }
/* SPACE sa table */
#result_list { background: #fff; border-radius: 12px; padding: 10px; }
#result_list table { width: 100%; }
#result_list table th, #result_list table td { padding: 14px 22px !important; white-space: nowrap; vertical-align: middle; }
</style>
{% endblock %}
